kind = "web"
previewPath = "/"
title = "Hammami Transport"
version = "1.0.0"
id = "artifacts/hammami-transport"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24286

[services.development]
run = "pnpm --filter @workspace/hammami-transport run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hammami-transport", "run", "build" ]
publicDir = "artifacts/hammami-transport/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24286"
BASE_PATH = "/"
