openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Hammami Transport API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: transactions
    description: Delivery transaction operations
  - name: stats
    description: Dashboard statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /transactions:
    get:
      operationId: listTransactions
      tags: [transactions]
      summary: List all transactions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [transactions]
      summary: Create a new transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"

  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [transactions]
      summary: Get a transaction by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    patch:
      operationId: updateTransaction
      tags: [transactions]
      summary: Update a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found
    delete:
      operationId: deleteTransaction
      tags: [transactions]
      summary: Delete a transaction
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /transactions/{id}/confirm:
    patch:
      operationId: confirmTransaction
      tags: [transactions]
      summary: Confirm a transaction as delivered
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Not found

  /stats:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/recent:
    get:
      operationId: getRecentTransactions
      tags: [stats]
      summary: Get recent 5 transactions for dashboard
      responses:
        "200":
          description: Recent transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Transaction:
      type: object
      required:
        - id
        - trackingNumber
        - senderName
        - recipientName
        - recipientCity
        - status
        - weight
        - price
        - createdAt
      properties:
        id:
          type: integer
        trackingNumber:
          type: string
        senderName:
          type: string
        senderPhone:
          type: ["string", "null"]
        recipientName:
          type: string
        recipientPhone:
          type: ["string", "null"]
        recipientCity:
          type: string
        description:
          type: ["string", "null"]
        weight:
          type: number
        price:
          type: number
        status:
          type: string
          enum: [en_livraison, livree, retournee, annulee]
        createdAt:
          type: string
        updatedAt:
          type: ["string", "null"]

    TransactionInput:
      type: object
      required:
        - senderName
        - recipientName
        - recipientCity
        - weight
        - price
      properties:
        senderName:
          type: string
        senderPhone:
          type: string
        recipientName:
          type: string
        recipientPhone:
          type: string
        recipientCity:
          type: string
        description:
          type: string
        weight:
          type: number
        price:
          type: number

    TransactionUpdate:
      type: object
      properties:
        senderName:
          type: string
        senderPhone:
          type: string
        recipientName:
          type: string
        recipientPhone:
          type: string
        recipientCity:
          type: string
        description:
          type: string
        weight:
          type: number
        price:
          type: number
        status:
          type: string
          enum: [en_livraison, livree, retournee, annulee]

    DashboardStats:
      type: object
      required:
        - total
        - enLivraison
        - livrees
        - retournees
        - annulees
        - totalRevenue
        - todayDeliveries
      properties:
        total:
          type: integer
        enLivraison:
          type: integer
        livrees:
          type: integer
        retournees:
          type: integer
        annulees:
          type: integer
        totalRevenue:
          type: number
        todayDeliveries:
          type: integer
